<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f39800">
<title>値下げスター</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
  --bg:#f6efdd; --card:#ffffff; --line:#e0d7c3;
  --text:#3a3a3a; --text2:#8d8574; --text3:#b5ad9c;
  --orange:#f39800; --orange-deep:#e8720c; --orange-pale:#fdf3e0;
  --brown:#43301f;
  --blue:#3b7bbf; --blue-pale:#e3f0fa;
  --pink:#d9538a; --pink-pale:#fbe9f1;
  --green:#2e8b57; --red:#d0342c;
  --yellow-line:#f0ad4e; --yellow-pale:#fdf6df;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:100%/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}

/* ---------- ヘッダー（プライスターオレンジ） ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#ffb340,#f39800);
  border-bottom:2px solid var(--orange-deep);
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
}
.hrow{display:flex;align-items:center;gap:7px}
h1{font-size:1.04rem;font-weight:800;letter-spacing:-0.01em;flex:1;color:#fff;text-shadow:0 1px 2px rgba(140,70,0,.35)}
.hbtn{
  min-height:36px;padding:6px 11px;border-radius:999px;font-size:.85rem;font-weight:700;
  background:rgba(255,255,255,.92);color:var(--orange-deep);
  box-shadow:0 1px 2px rgba(120,60,0,.25);
  transition:transform .1s ease-out,opacity .1s;position:relative;
}
.hbtn:active{transform:scale(.95)}
.hbtn:disabled{opacity:.45}
.badge{
  position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--red);color:#fff;font-size:.7rem;font-weight:700;line-height:19px;text-align:center;
}
.filemeta{font-size:.72rem;color:#fff8ec;margin-top:4px;min-height:1em;opacity:.95}

/* ---------- コントロール ---------- */
.controls{padding:10px 12px 4px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:#eadfc8;border-radius:8px;padding:2px;border:1px solid var(--line)}
.seg button{
  flex:1;min-height:32px;border-radius:6px;font-size:.85rem;font-weight:700;color:var(--text2);
  transition:transform .1s ease-out;
}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--orange);color:#fff;box-shadow:0 1px 3px rgba(160,90,0,.3)}
.chiprow{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;min-height:32px;padding:5px 13px;border-radius:999px;font-size:.83rem;font-weight:700;
  background:var(--card);color:var(--text2);border:1px solid var(--line);
  transition:transform .1s ease-out;
}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--orange);border-color:var(--orange-deep);color:#fff}
.searchwrap{position:relative;background:var(--brown);border-radius:9px;padding:6px}
.search{
  width:100%;min-height:34px;padding:6px 12px 6px 30px;border-radius:6px;border:none;
  background:#fff;color:var(--text);font-size:16px;outline:none;
}
.searchwrap::before{
  content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.8rem;opacity:.55;z-index:1;
}
.stats{font-size:.76rem;color:var(--text2);padding:0 2px}

/* ---------- カード（PC在庫一覧の行） ---------- */
#list{padding:8px 10px 90px;display:flex;flex-direction:column;gap:8px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 11px;
  box-shadow:0 1px 2px rgba(120,90,40,.08);
}
.card.changed{border-color:var(--orange-deep);box-shadow:0 0 0 1.5px var(--orange-deep)}
.ctop{display:flex;gap:10px;margin-bottom:8px}
.thumb{
  width:56px;height:80px;flex:0 0 56px;object-fit:contain;border-radius:3px;
  background:#f1ece0;border:1px solid var(--line);
}
.thumb.noimg{visibility:hidden}
.cmain{flex:1;min-width:0}
.ctitle{
  display:block;text-align:left;width:100%;
  font-size:.9rem;font-weight:700;line-height:1.35;color:var(--blue);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ctitle:active{opacity:.6}
.csub{font-size:.68rem;color:var(--text2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px}
.tg{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid transparent}
.tg-cond{background:#f1ece0;color:#6b6353;border-color:#ddd3bd}
.tg-cond.collector{background:var(--pink-pale);color:var(--pink);border-color:#efc3d6}
.tg-trace{background:var(--blue-pale);color:#2f6ea3;border-color:#bcd8ee}
.tg-trace.aim{background:var(--orange-deep);color:#fff;border-color:#c65f08}
.tg-stuck{background:var(--pink-pale);color:var(--red);border-color:#f0c4c1}
.cdate{font-size:.7rem;color:var(--text2);margin-left:auto}
.cdate .days{font-weight:800}
.cdate .days.old{color:var(--red)}

/* 価格グリッド */
.pgrid{display:flex;gap:7px;margin-bottom:7px}
.pbox{
  flex:1;min-width:0;border-radius:6px;padding:6px 9px;background:#faf6ec;border:1px solid var(--line);
  text-align:left;transition:transform .1s ease-out;
}
.pbox:active{transform:scale(.96)}
.plabel{font-size:.65rem;font-weight:700;color:var(--text2);white-space:nowrap}
.pbox.akaji{background:var(--orange-pale);border-color:var(--orange)}
.pbox.akaji .plabel{color:var(--orange-deep)}
.pbox.akaji .plabel::after{content:" ▼値下げ"}
.pbox.lowest{background:var(--blue-pale);border-color:#9cc4e4}
.pbox.lowest .plabel{color:#2f6ea3}
.pval{font-size:1.05rem;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.pval .arrow{color:var(--orange-deep);font-weight:800}
.pval .newv{color:var(--orange-deep)}
.pval.link{color:#2f6ea3;font-size:.86rem;font-weight:800}
.metaline{font-size:.73rem;color:var(--text2);margin-bottom:8px;font-variant-numeric:tabular-nums}
.metaline b{color:var(--green);font-weight:800}
.metaline b.minus{color:var(--red)}
.metaline .cost{border:1px solid var(--yellow-line);background:var(--yellow-pale);border-radius:4px;padding:0 5px;color:#8a6d1a;font-weight:700}

/* アクション */
.actions{display:flex;gap:7px}
.abtn{
  flex:1;min-height:38px;border-radius:6px;font-size:.9rem;font-weight:800;
  background:#fff;color:var(--orange-deep);border:1.5px solid var(--orange);
  transition:transform .1s ease-out,background .15s;
}
.abtn:active{transform:scale(.95);background:var(--orange-pale)}
.abtn.undo{color:var(--red);border-color:#e0a8a4}
.abtn.keepa{flex:0 0 auto;padding:0 12px;background:#31b0d5;border-color:#2494b5;color:#fff;font-weight:700;font-size:.8rem}
.editrow{display:flex;gap:7px}
.editrow input{
  flex:1;min-width:0;min-height:38px;border-radius:6px;border:1.5px solid var(--orange-deep);
  padding:0 12px;font-size:16px;background:#fff;color:var(--text);outline:none;
  font-variant-numeric:tabular-nums;
}
.editrow .abtn{flex:0 0 auto;padding:0 16px}
.editrow .abtn.ok{background:var(--orange);color:#fff}

/* ---------- 空状態・その他 ---------- */
.empty{padding:56px 28px;text-align:center;color:var(--text2);font-size:.9rem;line-height:1.9}
.empty .big{font-size:2.2rem;display:block;margin-bottom:8px}
#moreSentinel{height:1px}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
  background:var(--brown);color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.2,.8,.3,1);z-index:50;
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 書き出しシート ---------- */
.sheetback{
  position:fixed;inset:0;background:rgba(60,40,10,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheetback.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;
  background:var(--card);border-radius:16px 16px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
}
.sheet.show{transform:translateY(0)}
.grabber{width:38px;height:5px;border-radius:3px;background:#d8cfba;margin:0 auto 14px}
.sheet h2{font-size:1rem;font-weight:800;margin-bottom:6px}
.sheet p{font-size:.83rem;color:var(--text2);line-height:1.7;margin-bottom:14px}
.sheetbtn{
  width:100%;min-height:48px;border-radius:8px;font-size:.95rem;font-weight:800;margin-bottom:9px;
  background:var(--orange);color:#fff;transition:transform .1s ease-out;
}
.sheetbtn:active{transform:scale(.97)}
.sheetbtn.sub{background:#f1ece0;color:var(--text)}
.sheetbtn.warn{background:#f1ece0;color:var(--red)}

/* ---------- 反映シート ---------- */
.applylist{max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;
  border:1px solid var(--line);border-radius:6px;background:#faf6ec}
.arow{display:flex;gap:8px;align-items:baseline;padding:7px 9px;border-bottom:1px solid #efe8d6;font-size:.78rem}
.arow:last-child{border-bottom:none}
.arow .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.arow .av{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.arow .av .newv{color:var(--orange-deep)}
.applying{pointer-events:none}
.applying .applylist, .applying #sheetDesc{opacity:.35}

/* 反映中／結果の表示 */
.applybox{
  border:1px solid var(--line);border-radius:8px;background:#faf6ec;
  padding:16px 14px;margin-bottom:12px;text-align:center;
}
.applybox.ok{background:#eef8f0;border-color:#a9d8b8}
.applybox.ng{background:#fdeae8;border-color:#efb9b4}
.spinner{
  width:30px;height:30px;margin:0 auto 10px;border-radius:50%;
  border:3px solid #e6dcc6;border-top-color:var(--orange);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.applystep{font-size:.9rem;font-weight:700;margin-bottom:4px}
.applynote{font-size:.76rem;color:var(--text2);line-height:1.6}
.applybig{font-size:1.5rem;margin-bottom:6px}
.applyres{font-size:.95rem;font-weight:800;margin-bottom:5px}
.applyres.ok{color:var(--green)}
.applyres.ng{color:var(--red)}

/* ---------- 詳細編集シート ---------- */
.edtrow{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.edtlabel{flex:0 0 96px;font-size:.8rem;font-weight:700;color:var(--text2)}
.edtinput{
  flex:1;min-width:0;min-height:42px;border-radius:6px;border:1.5px solid var(--line);
  padding:0 12px;font-size:16px;background:#fff;color:var(--text);outline:none;font-variant-numeric:tabular-nums;
}
.edtinput:focus{border-color:var(--orange)}
.edtorig{font-size:.7rem;color:var(--text3);flex:0 0 auto;min-width:58px;text-align:right}
.tracegrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tracegrid button{
  flex:1 1 30%;min-height:38px;border-radius:6px;font-size:.8rem;font-weight:700;
  background:#fff;border:1px solid var(--line);color:var(--text2);
}
.tracegrid button.on{background:var(--orange);border-color:var(--orange-deep);color:#fff}

/* ---------- 一括操作シート ---------- */
.bulkhint{font-size:.78rem;color:var(--text2);line-height:1.7;margin-bottom:10px}
.bulkcount{font-size:.9rem;font-weight:800;color:var(--orange-deep);margin-bottom:12px}
.daysrow{display:flex;gap:7px;margin-bottom:12px;align-items:center}
.daysrow input{
  flex:0 0 90px;min-height:42px;border-radius:6px;border:1.5px solid var(--orange);
  padding:0 12px;font-size:16px;text-align:center;background:#fff;color:var(--text);outline:none;
}
.daysrow span{font-size:.85rem;color:var(--text2)}

/* ---------- Keepaグラフの小窓 ---------- */
.graphwrap{margin-bottom:10px;min-height:180px}
.graphimg{width:100%;border:1px solid var(--line);border-radius:6px;background:#faf6ec;min-height:180px;object-fit:contain}

/* ---------- 出品一覧の小窓 ---------- */
.offersbody{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -6px 10px;padding:0 6px}
.orow{
  display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #efe8d6;
}
.orow:last-child{border-bottom:none}
.ocond{flex:0 0 92px}
.oprice{font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.osub{font-size:.68rem;color:var(--text2);font-variant-numeric:tabular-nums}
.obadges{margin-left:auto;display:flex;gap:4px;align-items:center;flex-shrink:0}
.tg-fba{background:var(--orange-pale);color:var(--orange-deep);border-color:#f2c78b}
.tg-prime{background:var(--blue-pale);color:#2f6ea3;border-color:#bcd8ee}
.oseen{font-size:.66rem;color:var(--text3);flex-shrink:0;text-align:right;min-width:52px}
.omine{
  background:var(--yellow-pale);border:1px solid var(--yellow-line);border-radius:6px;
  padding:6px 10px;font-size:.78rem;font-weight:700;color:#8a6d1a;margin-bottom:8px;
}
.oload{padding:26px 0;text-align:center;color:var(--text2);font-size:.85rem}
.offersfoot{font-size:.7rem;color:var(--text3);text-align:right;margin-bottom:10px}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>値下げスター</h1>
    <button class="hbtn" id="cloudBtn">☁️ 更新</button>
    <button class="hbtn" id="importBtn">CSV読込</button>
    <button class="hbtn" id="exportBtn" disabled>反映<span class="badge" id="chgBadge" hidden>0</span></button>
  </div>
  <div class="filemeta" id="fileMeta"></div>
</header>

<div class="controls" id="controls" hidden>
  <div class="seg" id="segCond">
    <button data-v="all" class="on">すべて</button>
    <button data-v="collector">コレクター</button>
    <button data-v="used">中古</button>
  </div>
  <div class="chiprow">
    <button class="chip on" id="sortChip" data-mode="new">新しい順</button>
    <button class="chip" id="stuckChip">下限張り付き</button>
    <button class="chip" id="changedChip">変更のみ</button>
    <button class="chip" id="bulkChip">まとめて設定</button>
  </div>
  <div class="searchwrap"><input class="search" id="search" type="search" placeholder="タイトル・SKUで検索" autocomplete="off"></div>
  <div class="stats" id="stats"></div>
</div>

<div id="list">
  <div class="empty" id="emptyMsg">
    <span class="big">📦</span>
    プライスターの<b>「CSVで一括変更」→ダウンロード</b>した<br>
    editUploadProduct_FBA.csv を読み込んでください。<br><br>
    右上の「CSV読込」から選択できます。<br>
    データはこの端末の中だけに保存されます。
  </div>
</div>
<div id="moreSentinel"></div>

<div class="toast" id="toast"></div>

<div class="sheetback" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <h2>プライスターに反映する</h2>
  <p id="sheetDesc"></p>
  <div id="applyStatus" hidden></div>
  <div class="applylist" id="applyList"></div>
  <button class="sheetbtn" id="doApply">この内容で反映する</button>
  <button class="sheetbtn sub" id="doExport">CSVで書き出す（従来の方法）</button>
  <button class="sheetbtn warn" id="clearChanges">変更をすべて取り消す</button>
  <button class="sheetbtn sub" id="closeSheet">閉じる</button>
</div>

<div class="sheetback" id="edtBack"></div>
<div class="sheet" id="edtSheet">
  <div class="grabber"></div>
  <h2 id="edtTitle">価格を編集</h2>
  <div class="edtrow">
    <span class="edtlabel">出品価格</span>
    <input class="edtinput" id="edtPrice" type="text" inputmode="numeric" pattern="[0-9]*">
    <span class="edtorig" id="edtPriceOrig"></span>
  </div>
  <div class="edtrow">
    <span class="edtlabel">赤字ｽﾄｯﾊﾟｰ</span>
    <input class="edtinput" id="edtAkaji" type="text" inputmode="numeric" pattern="[0-9]*">
    <span class="edtorig" id="edtAkajiOrig"></span>
  </div>
  <div class="edtrow">
    <span class="edtlabel">高値ｽﾄｯﾊﾟｰ</span>
    <input class="edtinput" id="edtTakane" type="text" inputmode="numeric" pattern="[0-9]*">
    <span class="edtorig" id="edtTakaneOrig"></span>
  </div>
  <div class="edtlabel" style="margin-bottom:7px">価格の自動変更</div>
  <div class="tracegrid" id="edtTrace">
    <button data-t="0">しない</button>
    <button data-t="2">状態合わせ</button>
    <button data-t="4">最安値</button>
    <button data-t="1">FBA状態合わせ</button>
    <button data-t="3">FBA最安値</button>
    <button data-t="5">カート価格</button>
  </div>
  <button class="sheetbtn" id="edtOk">この内容にする</button>
  <button class="sheetbtn sub" id="edtCancel">閉じる</button>
</div>

<div class="sheetback" id="bulkBack"></div>
<div class="sheet" id="bulkSheet">
  <div class="grabber"></div>
  <h2>まとめて価格の自動変更</h2>
  <p class="bulkhint">いま表示している商品が対象です（絞り込み・検索が効きます）。<br>出品からの経過日数でさらに絞れます。</p>
  <div class="daysrow">
    <input id="bulkDays" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="90">
    <span>日以上たった商品だけ（空欄なら全部）</span>
  </div>
  <div class="bulkcount" id="bulkCount"></div>
  <div class="edtlabel" style="margin-bottom:7px">この設定に切り替える</div>
  <div class="tracegrid" id="bulkTrace">
    <button data-t="4">最安値</button>
    <button data-t="2">状態合わせ</button>
    <button data-t="3">FBA最安値</button>
    <button data-t="1">FBA状態合わせ</button>
    <button data-t="5">カート価格</button>
    <button data-t="0">しない</button>
  </div>
  <button class="sheetbtn" id="bulkOk">この設定にする</button>
  <button class="sheetbtn sub" id="bulkCancel">閉じる</button>
</div>

<div class="sheetback" id="graphBack"></div>
<div class="sheet" id="graphSheet">
  <div class="grabber"></div>
  <h2 id="graphTitle">Keepa 価格推移</h2>
  <div class="chiprow" style="margin-bottom:10px">
    <button class="chip" data-range="30">30日</button>
    <button class="chip on" data-range="90">90日</button>
    <button class="chip" data-range="365">1年</button>
  </div>
  <div class="graphwrap"><img class="graphimg" id="graphImg" referrerpolicy="no-referrer" alt="価格推移グラフ"></div>
  <button class="sheetbtn sub" id="graphKeepa">Keepaサイトで開く</button>
  <button class="sheetbtn sub" id="graphClose">閉じる</button>
</div>

<div class="sheetback" id="offersBack"></div>
<div class="sheet" id="offersSheet">
  <div class="grabber"></div>
  <h2 id="offersTitle">出品一覧</h2>
  <div class="omine" id="offersMine" hidden></div>
  <div class="offersbody" id="offersBody"></div>
  <div class="offersfoot" id="offersFoot"></div>
  <button class="sheetbtn sub" id="offersAmazon">Amazonで開く</button>
  <button class="sheetbtn sub" id="offersClose">閉じる</button>
</div>

<input type="file" id="fileInput" accept=".csv,text/csv" hidden>

<script src="./csv-core.js"></script>
<script>
(function(){
'use strict';
var CORE = window.CSVCore;

/* ---------- 状態 ---------- */
var fileBytes = null;      // Uint8Array（元CSVそのまま）
var fileName = '';
var fileSource = '';       // 'クラウド …取得' など（空なら手動読込）
var importedAt = 0;

/* ---------- 永続化 ---------- */
var LS_CHANGES = 'nesage-changes';
function loadChanges(){
  try{ changes = JSON.parse(localStorage.getItem(LS_CHANGES) || '{}'); }catch(e){ changes = {}; }
}
function saveChanges(){ localStorage.setItem(LS_CHANGES, JSON.stringify(changes)); }

function idb(){
  return new Promise(function(res, rej){
    var r = indexedDB.open('nesage', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbPut(key, val){
  return idb().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbGet(key){
  return idb().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction('kv', 'readonly');
      var q = tx.objectStore('kv').get(key);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}

/* ---------- ユーティリティ ---------- */
function yen(n){ return '¥' + Number(n).toLocaleString('ja-JP'); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function daysSince(dateStr){
  if(!dateStr) return null;
  var d = new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8));
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
var toastTimer = null;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ---------- 共通取り込み（ファイル・クラウド両方から呼ぶ） ---------- */
function ingestBytes(u8, name, sourceLabel){
  var p = CORE.parseFile(u8);
  fileBytes = u8; fileName = name; fileSource = sourceLabel || ''; importedAt = Date.now(); parsed = p;
  idbPut('file', { bytes: u8, name: name, at: importedAt, source: fileSource });
  var known = {};
  p.items.forEach(function(it){ known[it.sku] = 1; });
  var dropped = 0;
  Object.keys(changes).forEach(function(sku){ if(!known[sku]){ delete changes[sku]; dropped++; } });
  if(dropped) saveChanges();
  toast(p.items.length + '件 読み込みました' + (dropped ? '（対象外の変更' + dropped + '件は削除）' : ''));
  refresh();
}

/* ---------- クラウド更新 ---------- */
var DATA_URL = localStorage.getItem('nesage-data-url') || 'https://nesage-data.pages.dev/latest.json';
var APPLY_URL = localStorage.getItem('nesage-apply-url') || 'https://nesage-apply.naitou0121.workers.dev';
var LS_PASS = 'nesage-pass';

function b64ToU8(s){
  var bin = atob(s);
  var u8 = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function deriveAesKey(blob, passphrase){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToU8(blob.salt), iterations: blob.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    });
}

function decryptBlob(blob, passphrase){
  return deriveAesKey(blob, passphrase).then(function(key){
    var main = crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToU8(blob.iv) }, key, b64ToU8(blob.ct))
      .then(function(buf){ return new Uint8Array(buf); });
    // Keepaキーが同梱されていれば復号して端末に保存（小窓用）
    var keepa = Promise.resolve();
    if(blob.keepa && blob.keepa.ct){
      keepa = crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToU8(blob.keepa.iv) }, key, b64ToU8(blob.keepa.ct))
        .then(function(buf){ localStorage.setItem('nesage-keepa', new TextDecoder().decode(buf)); })
        .catch(function(){});
    }
    return keepa.then(function(){ return main; });
  });
}

$('cloudBtn').addEventListener('click', function(){
  var btn = this;
  btn.disabled = true;
  fetch(DATA_URL, { cache: 'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('データがまだありません（' + r.status + '）');
      return r.json();
    })
    .then(function(blob){
      var pass = localStorage.getItem(LS_PASS);
      if(!pass){
        pass = (prompt('合言葉を入力してください（初回のみ）') || '').trim();
        if(!pass) throw new Error('キャンセルしました');
      }
      return decryptBlob(blob, pass).then(function(u8){
        localStorage.setItem(LS_PASS, pass);
        var label = 'クラウド ' + new Date(blob.fetchedAt).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) + ' 取得';
        ingestBytes(u8, blob.name || 'editUploadProduct_FBA.csv', label);
      }).catch(function(e){
        if(e && e.name === 'OperationError'){
          localStorage.removeItem(LS_PASS);
          throw new Error('合言葉が違います。もう一度「☁️ 更新」を押してください');
        }
        throw e;
      });
    })
    .catch(function(e){ toast(e.message || '更新に失敗しました'); })
    .finally(function(){ btn.disabled = false; });
});

/* ---------- 読み込み ---------- */
$('importBtn').addEventListener('click', function(){ $('fileInput').click(); });
$('fileInput').addEventListener('change', function(){
  var f = this.files[0];
  this.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      ingestBytes(new Uint8Array(reader.result), f.name, '');
    }catch(e){
      toast('読み込み失敗：' + e.message);
    }
  };
  reader.readAsArrayBuffer(f);
});

/* ---------- 一覧描画 ---------- */
function computeVisible(){
  if(!parsed) return [];
  var items = parsed.items.filter(function(it){
    if(filterCond === 'collector' && !CORE.isCollector(it.condition)) return false;
    if(filterCond === 'used' && CORE.isCollector(it.condition)) return false;
    if(onlyStuck && it.price !== it.akaji) return false;
    if(onlyChanged && !(it.sku in changes)) return false;
    if(query){
      var hay = (it.title + ' ' + it.sku + ' ' + it.asin).toLowerCase();
      if(hay.indexOf(query) === -1) return false;
    }
    return true;
  });
  items.sort(function(a, b){
    if(sortMode === 'priceHigh') return b.price - a.price;
    if(sortMode === 'priceLow') return a.price - b.price;
    var da = a.dateStr || '00000000', db2 = b.dateStr || '00000000';
    if(sortMode === 'old'){
      if(da === db2) return a.sku < b.sku ? -1 : 1;
      if(da === '00000000') return 1;
      if(db2 === '00000000') return -1;
      return da < db2 ? -1 : 1;
    }
    if(da === db2) return a.sku < b.sku ? -1 : 1;
    return da > db2 ? -1 : 1; // new: 日付降順・日付不明は末尾
  });
  return items;
}

function pendingValue(it){
  var c = changes[it.sku];
  if(!c) return null;
  var t = CORE.targetField(it);
  return (c[t] != null) ? c[t] : null;
}

function thumbURL(asin){
  return 'https://images-na.ssl-images-amazon.com/images/P/' + encodeURIComponent(asin) + '.09._SL160_.jpg';
}

function cardHTML(it){
  var isCol = CORE.isCollector(it.condition);
  var condLabel = CORE.CONDITION_LABEL[it.condition] || ('状態' + it.condition);
  // PC在庫一覧の表記に合わせる：中古品 良い／コレクター商品 良い
  var condText = condLabel.replace('中古・', '中古品 ').replace('コレクター・', 'コレクター商品 ');
  var days = daysSince(it.dateStr);
  var dateHtml = '';
  if(it.dateStr){
    var dstr = (+it.dateStr.slice(4,6)) + '/' + (+it.dateStr.slice(6,8));
    if(+it.dateStr.slice(0,4) !== new Date().getFullYear()) dstr = it.dateStr.slice(0,4) + '/' + dstr;
    dateHtml = '<span class="cdate">' + dstr + '作成 · <span class="days' + (days >= 60 ? ' old' : '') + '">' + days + '日</span></span>';
  } else {
    dateHtml = '<span class="cdate">作成日不明</span>';
  }
  var chg = changes[it.sku] || {};
  var target = CORE.targetField(it);       // 'price'（出品価格を直値下げ）| 'akaji'（赤字ストッパー）
  var pending = pendingValue(it);
  var traceNew = (chg.priceTrace != null && chg.priceTrace !== '') ? String(chg.priceTrace) : null;
  var takaneNew = (chg.takane != null && chg.takane !== '') ? chg.takane : null;
  var valHtml = function(orig){
    return (pending != null)
      ? '<span class="pval">' + yen(orig) + '<span class="arrow"> → </span><span class="newv">' + yen(pending) + '</span></span>'
      : '<span class="pval">' + yen(orig) + '</span>';
  };
  var priceBox, akajiBox;
  if(target === 'price'){
    priceBox = '<button class="pbox akaji" data-act="offers"><div class="plabel">出品価格</div>' + valHtml(it.price) + '</button>';
    akajiBox = '<button class="pbox" data-act="offers"><div class="plabel">赤字ｽﾄｯﾊﾟｰ</div><span class="pval">' + (it.akaji === 0 ? '－' : yen(it.akaji)) + '</span></button>';
  } else {
    priceBox = '<button class="pbox" data-act="offers"><div class="plabel">出品価格</div><span class="pval">' + yen(it.price) + '</span></button>';
    akajiBox = '<button class="pbox akaji" data-act="offers"><div class="plabel">赤字ｽﾄｯﾊﾟｰ</div>' + valHtml(it.akaji) + '</button>';
  }
  var lowestBox = '<button class="pbox lowest" data-act="offers"><div class="plabel">最低価格</div><span class="pval link">出品一覧 ›</span></button>';
  var stuck = it.akaji > 0 && it.price === it.akaji;
  var trace = traceNew
    ? (CORE.PRICETRACE_LABEL[it.priceTrace] || '') + '→' + (CORE.PRICETRACE_LABEL[traceNew] || traceNew)
    : (CORE.PRICETRACE_LABEL[it.priceTrace] || '');
  var traceCls = traceNew ? 'tg-trace aim' : ((it.priceTrace === '2' || it.priceTrace === '1') ? 'tg-trace aim' : 'tg-trace');
  var profitCls = it.profit < 0 ? ' class="minus"' : '';
  var profitPct = it.price > 0 ? ' (' + (it.profit / it.price * 100).toFixed(1) + '%)' : '';
  var actions = (Object.keys(chg).length > 0)
    ? '<button class="abtn" data-act="minus100">' + (pending != null ? 'さらに−100' : '−100') + '</button>' +
      '<button class="abtn" data-act="edit">編集</button>' +
      '<button class="abtn undo" data-act="undo">取消</button>'
    : '<button class="abtn" data-act="minus100">−100</button>' +
      '<button class="abtn" data-act="edit">編集</button>';
  var hasChange = Object.keys(chg).length > 0;
  return '<div class="card' + (hasChange ? ' changed' : '') + '" data-sku="' + esc(it.sku) + '">' +
    '<div class="ctop">' +
      '<img class="thumb" src="' + thumbURL(it.asin) + '" loading="lazy" alt="" onerror="this.classList.add(\'noimg\')">' +
      '<div class="cmain">' +
        '<button class="ctitle" data-act="amazon">' + esc(it.title) + '</button>' +
        '<div class="csub">' + esc(it.asin) + ' · ' + esc(it.sku) + '</div>' +
        '<div class="tagrow">' +
          '<span class="tg tg-cond' + (isCol ? ' collector' : '') + '">' + esc(condText) + '</span>' +
          (trace ? '<span class="tg ' + traceCls + '">' + esc(trace) + (target === 'price' ? '→直値下げ' : '') + '</span>' : '') +
          (stuck ? '<span class="tg tg-stuck">下限張り付き</span>' : '') +
          dateHtml +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="pgrid">' + priceBox + akajiBox + lowestBox + '</div>' +
    '<div class="metaline">仕入れ <span class="cost">' + yen(it.cost) + '</span> · 粗利益 <b' + profitCls + '>' + yen(it.profit) + profitPct + '</b>' +
      (takaneNew != null ? ' · 高値ｽﾄｯﾊﾟｰ ' + (it.takane > 0 ? yen(it.takane) : '－') + '→' + yen(takaneNew)
        : (it.takane > 0 ? ' · 高値ｽﾄｯﾊﾟｰ ' + yen(it.takane) : '')) +
      (it.number > 1 ? ' · 数量' + it.number : '') +
    '</div>' +
    '<div class="actions"><button class="abtn keepa" data-act="keepa">Keepa</button>' + actions + '</div>' +
  '</div>';
}

function renderMore(){
  if(!visibleItems.length || renderedCount >= visibleItems.length) return;
  var frag = [];
  var end = Math.min(renderedCount + CHUNK, visibleItems.length);
  for(var i = renderedCount; i < end; i++) frag.push(cardHTML(visibleItems[i]));
  $('list').insertAdjacentHTML('beforeend', frag.join(''));
  renderedCount = end;
}

function refresh(){
  var list = $('list');
  if(!parsed){
    $('controls').hidden = true;
    updateHeader();
    return;
  }
  $('controls').hidden = false;
  visibleItems = computeVisible();
  renderedCount = 0;
  list.innerHTML = visibleItems.length ? '' :
    '<div class="empty"><span class="big">🔍</span>該当する商品がありません</div>';
  renderMore();
  updateHeader();
  var total = parsed.items.length;
  var colN = parsed.items.filter(function(it){ return CORE.isCollector(it.condition); }).length;
  var stuckN = parsed.items.filter(function(it){ return it.price === it.akaji; }).length;
  $('stats').textContent = '表示 ' + visibleItems.length + ' / 全' + total + '件 · コレクター' + colN + ' · 張り付き' + stuckN;
  window.scrollTo(0, 0);
}

function updateHeader(){
  var n = Object.keys(changes).length;
  $('chgBadge').hidden = n === 0;
  $('chgBadge').textContent = n;
  $('exportBtn').disabled = !parsed || n === 0;
  $('fileMeta').textContent = parsed
    ? (fileSource || fileName + ' ' + new Date(importedAt).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) + ' 読込') + '・' + parsed.items.length + '件'
    : '';
}

/* 1枚のカードだけ再描画（全リスト再構築でスクロール位置を壊さない） */
function updateCard(sku){
  var el = document.querySelector('.card[data-sku="' + (window.CSS && CSS.escape ? CSS.escape(sku) : sku) + '"]');
  var it = parsed.items.find(function(x){ return x.sku === sku; });
  if(el && it){
    var tmp = document.createElement('div');
    tmp.innerHTML = cardHTML(it);
    el.replaceWith(tmp.firstChild);
  }
  updateHeader();
}

/* ---------- カード操作 ---------- */
$('list').addEventListener('click', function(e){
  var btn = e.target.closest('[data-act]');
  if(!btn) return;
  var card = btn.closest('.card');
  var sku = card.getAttribute('data-sku');
  var it = parsed.items.find(function(x){ return x.sku === sku; });
  if(!it) return;
  var act = btn.getAttribute('data-act');
  var target = CORE.targetField(it);
  var pv = pendingValue(it);
  var cur = (pv != null) ? pv : it[target];

  if(act === 'offers'){
    openOffers(it);
    return;
  }
  if(act === 'amazon'){
    if(it.asin) window.open('https://www.amazon.co.jp/dp/' + encodeURIComponent(it.asin), '_blank');
    return;
  }
  if(act === 'keepa'){
    openGraph(it);
    return;
  }
  if(act === 'minus50' || act === 'minus100'){
    var delta = act === 'minus50' ? 50 : 100;
    var nv = Math.max(0, cur - delta);
    var c = changes[sku] || {};
    if(nv === it[target]) delete c[target]; else c[target] = nv;
    if(Object.keys(c).length) changes[sku] = c; else delete changes[sku];
    saveChanges(); updateCard(sku);
    return;
  }
  if(act === 'undo'){
    delete changes[sku];
    saveChanges(); updateCard(sku);
    return;
  }
  if(act === 'edit'){
    openEdit(it);
    return;
  }
});

/* ---------- 詳細編集シート（価格・赤字・高値・自動変更） ---------- */
var edtSku = null;
function fieldValue(it, f){
  var c = changes[it.sku];
  if(c && c[f] != null && c[f] !== '') return c[f];
  return it[f];
}
function openEdit(it){
  edtSku = it.sku;
  $('edtTitle').textContent = it.title.slice(0, 26) + (it.title.length > 26 ? '…' : '');
  $('edtPrice').value = fieldValue(it, 'price');
  $('edtAkaji').value = fieldValue(it, 'akaji');
  $('edtTakane').value = fieldValue(it, 'takane');
  $('edtPriceOrig').textContent = '元 ' + yen(it.price);
  $('edtAkajiOrig').textContent = '元 ' + (it.akaji === 0 ? '－' : yen(it.akaji));
  $('edtTakaneOrig').textContent = '元 ' + (it.takane === 0 ? '－' : yen(it.takane));
  var cur = String(fieldValue(it, 'priceTrace'));
  document.querySelectorAll('#edtTrace button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-t') === cur);
  });
  $('edtBack').classList.add('show'); $('edtSheet').classList.add('show');
}
function closeEdit(){ $('edtBack').classList.remove('show'); $('edtSheet').classList.remove('show'); }
$('edtBack').addEventListener('click', closeEdit);
$('edtCancel').addEventListener('click', closeEdit);
document.querySelectorAll('#edtTrace button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#edtTrace button').forEach(function(x){ x.classList.toggle('on', x === b); });
  });
});
$('edtOk').addEventListener('click', function(){
  var it = parsed.items.find(function(x){ return x.sku === edtSku; });
  if(!it) { closeEdit(); return; }
  var num = function(id){
    var v = parseInt(String($(id).value).replace(/[^0-9]/g, ''), 10);
    return isNaN(v) ? null : v;
  };
  var vals = { price: num('edtPrice'), akaji: num('edtAkaji'), takane: num('edtTakane') };
  var traceBtn = document.querySelector('#edtTrace button.on');
  vals.priceTrace = traceBtn ? traceBtn.getAttribute('data-t') : String(it.priceTrace);
  var c = {};
  ['price', 'akaji', 'takane'].forEach(function(f){
    if(vals[f] != null && vals[f] !== it[f]) c[f] = vals[f];
  });
  if(vals.priceTrace !== String(it.priceTrace)) c.priceTrace = vals.priceTrace;
  if(Object.keys(c).length) changes[it.sku] = c; else delete changes[it.sku];
  saveChanges();
  closeEdit();
  refresh();
});

/* ---------- まとめて設定（表示中＋経過日数で絞る） ---------- */
function bulkTargets(){
  var days = parseInt(String($('bulkDays').value).replace(/[^0-9]/g, ''), 10);
  return visibleItems.filter(function(it){
    if(isNaN(days)) return true;
    var d = daysSince(it.dateStr);
    return d != null && d >= days;
  });
}
function updateBulkCount(){
  var n = bulkTargets().length;
  $('bulkCount').textContent = '対象：' + n + '件';
  $('bulkOk').disabled = n === 0;
}
$('bulkChip').addEventListener('click', function(){
  if(!parsed) return;
  document.querySelectorAll('#bulkTrace button').forEach(function(b){ b.classList.remove('on'); });
  document.querySelector('#bulkTrace button[data-t="4"]').classList.add('on');
  updateBulkCount();
  $('bulkBack').classList.add('show'); $('bulkSheet').classList.add('show');
});
function closeBulk(){ $('bulkBack').classList.remove('show'); $('bulkSheet').classList.remove('show'); }
$('bulkBack').addEventListener('click', closeBulk);
$('bulkCancel').addEventListener('click', closeBulk);
$('bulkDays').addEventListener('input', updateBulkCount);
document.querySelectorAll('#bulkTrace button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#bulkTrace button').forEach(function(x){ x.classList.toggle('on', x === b); });
  });
});
$('bulkOk').addEventListener('click', function(){
  var btn = document.querySelector('#bulkTrace button.on');
  if(!btn) return;
  var t = btn.getAttribute('data-t');
  var targets = bulkTargets();
  var n = 0;
  targets.forEach(function(it){
    if(String(it.priceTrace) === t) return;   // 既にその設定なら触らない
    var c = changes[it.sku] || {};
    c.priceTrace = t;
    changes[it.sku] = c;
    n++;
  });
  saveChanges();
  closeBulk();
  refresh();
  toast(n ? n + '件を「' + btn.textContent + '」に設定しました' : '変更が必要な商品はありませんでした');
});

/* ---------- Keepaグラフの小窓（キー不要画像・トークン消費なし） ---------- */
var graphAsin = null;
function graphURL(asin, range){
  return 'https://graph.keepa.com/pricehistory.png?asin=' + encodeURIComponent(asin) +
    '&domain=co.jp&salesrank=1&amazon=1&new=1&used=1&range=' + range + '&width=760&height=340';
}
function openGraph(it){
  if(!it.asin) return;
  graphAsin = it.asin;
  $('graphTitle').textContent = 'Keepa 価格推移';
  var chips = document.querySelectorAll('#graphSheet .chip');
  chips.forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-range') === '90'); });
  $('graphImg').src = graphURL(it.asin, 90);
  $('graphBack').classList.add('show');
  $('graphSheet').classList.add('show');
}
function closeGraph(){ $('graphBack').classList.remove('show'); $('graphSheet').classList.remove('show'); }
$('graphBack').addEventListener('click', closeGraph);
$('graphClose').addEventListener('click', closeGraph);
$('graphKeepa').addEventListener('click', function(){
  if(graphAsin) window.open('https://keepa.com/#!product/5-' + encodeURIComponent(graphAsin), '_blank');
});
document.querySelectorAll('#graphSheet .chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    document.querySelectorAll('#graphSheet .chip').forEach(function(c){ c.classList.toggle('on', c === chip); });
    if(graphAsin) $('graphImg').src = graphURL(graphAsin, chip.getAttribute('data-range'));
  });
});
$('graphImg').addEventListener('error', function(){
  this.alt = 'グラフを取得できませんでした。下の「Keepaサイトで開く」からどうぞ';
});

/* ---------- 出品一覧の小窓（Keepa・タップ時のみ6トークン） ---------- */
var KEEPA_COND = {
  1:['新品',''], 2:['ほぼ新品',''], 3:['非常に良い',''], 4:['良い',''], 5:['可',''],
  6:['再生品',''], 7:['コレ・ほぼ新品','collector'], 8:['コレ・非常に良い','collector'],
  9:['コレ・良い','collector'], 10:['コレ・可','collector'],
};
var offersCache = {};   // asin -> {at, data}
var offersAsin = null;

function keepaTimeToMs(t){ return (t + 21564000) * 60000; }
function relTime(ms){
  var m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if(m < 60) return m + '分前';
  if(m < 1440) return Math.round(m / 60) + '時間前';
  return Math.round(m / 1440) + '日前';
}

function openOffersSheetUI(){ $('offersBack').classList.add('show'); $('offersSheet').classList.add('show'); }
function closeOffersSheet(){ $('offersBack').classList.remove('show'); $('offersSheet').classList.remove('show'); }
$('offersBack').addEventListener('click', closeOffersSheet);
$('offersClose').addEventListener('click', closeOffersSheet);
$('offersAmazon').addEventListener('click', function(){
  if(offersAsin) window.open('https://www.amazon.co.jp/dp/' + encodeURIComponent(offersAsin) + '?aod=1', '_blank');
});

function renderOffers(it, data){
  var p = data.products && data.products[0];
  var offers = (p && p.offers) || [];
  var order = (p && p.liveOffersOrder) || [];
  var live = order.map(function(i){ return offers[i]; }).filter(Boolean);
  if(!live.length) live = offers.slice(0, 10);
  var rows = live.map(function(o){
    var csv = o.offerCSV || [];
    var price = csv.length >= 2 ? csv[csv.length - 2] : -1;
    var ship = csv.length >= 1 ? csv[csv.length - 1] : 0;
    if(ship < 0) ship = 0;
    var total = price > 0 ? price + ship : 0;
    var c = KEEPA_COND[o.condition] || ['状態' + o.condition, ''];
    return { total: total, price: price, ship: ship, cond: c[0], condCls: c[1],
             fba: !!o.isFBA, prime: !!o.isPrime,
             seen: o.lastSeen ? keepaTimeToMs(o.lastSeen) : 0 };
  }).filter(function(r){ return r.total > 0; });
  rows.sort(function(a, b){ return a.total - b.total; });
  if(!rows.length){
    $('offersBody').innerHTML = '<div class="oload">現在の出品情報が取れませんでした</div>';
  } else {
    $('offersBody').innerHTML = rows.map(function(r){
      return '<div class="orow">' +
        '<span class="ocond"><span class="tg tg-cond ' + r.condCls + '">' + r.cond + '</span></span>' +
        '<span><span class="oprice">' + yen(r.total) + '</span>' +
          (r.ship > 0 ? '<div class="osub">' + yen(r.price) + '＋送料' + yen(r.ship) + '</div>' : '<div class="osub">送料込</div>') +
        '</span>' +
        '<span class="obadges">' +
          (r.fba ? '<span class="tg tg-fba">FBA</span>' : '') +
          (r.prime ? '<span class="tg tg-prime">prime</span>' : '') +
          '<span class="oseen">' + (r.seen ? relTime(r.seen) : '') + '</span>' +
        '</span>' +
      '</div>';
    }).join('');
  }
  $('offersFoot').textContent = '出品' + rows.length + '件 · Keepa残りトークン ' + (data.tokensLeft != null ? data.tokensLeft : '?') + '（毎分1回復）';
}

function openOffers(it){
  if(!it.asin) return;
  offersAsin = it.asin;
  var key = localStorage.getItem('nesage-keepa');
  if(!key){
    // 鍵未取得（クラウド更新前）は従来どおりAmazonへ
    window.open('https://www.amazon.co.jp/dp/' + encodeURIComponent(it.asin) + '?aod=1', '_blank');
    toast('小窓は「☁️ 更新」を1回してから使えます');
    return;
  }
  var target = CORE.targetField(it);
  var mineVal = pendingValue(it) != null ? pendingValue(it) : it[target];
  $('offersTitle').textContent = '出品一覧';
  $('offersMine').hidden = false;
  $('offersMine').textContent = '自分：' + (CORE.CONDITION_LABEL[it.condition] || '') + ' 出品価格 ' + yen(it.price) +
    (target === 'akaji' ? '（赤字ｽﾄｯﾊﾟｰ ' + yen(it.akaji) + '）' : '');
  openOffersSheetUI();
  var cached = offersCache[it.asin];
  if(cached && Date.now() - cached.at < 10 * 60 * 1000){
    renderOffers(it, cached.data);
    return;
  }
  $('offersBody').innerHTML = '<div class="oload">Keepaから取得中…（6トークン）</div>';
  $('offersFoot').textContent = '';
  fetch('https://api.keepa.com/product?key=' + encodeURIComponent(key) + '&domain=5&asin=' + encodeURIComponent(it.asin) + '&offers=20')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.error){
        var msg = data.error.message || 'エラー';
        if(data.tokensLeft != null && data.tokensLeft < 6) msg = 'トークン不足（残' + data.tokensLeft + '・毎分1回復）。少し待ってください';
        $('offersBody').innerHTML = '<div class="oload">' + esc(msg) + '</div>';
        return;
      }
      offersCache[it.asin] = { at: Date.now(), data: data };
      renderOffers(it, data);
    })
    .catch(function(){
      $('offersBody').innerHTML = '<div class="oload">取得に失敗しました。下の「Amazonで開く」からどうぞ</div>';
    });
}

/* ---------- 無限スクロール ---------- */
new IntersectionObserver(function(entries){
  if(entries[0].isIntersecting) renderMore();
}, { rootMargin: '600px' }).observe($('moreSentinel'));

/* ---------- 書き出し ---------- */
var FIELD_LABEL = { price: '出品価格', akaji: '赤字ｽﾄｯﾊﾟｰ', takane: '高値ｽﾄｯﾊﾟｰ', priceTrace: '自動変更' };

function changeSummaryHTML(){
  var out = [];
  Object.keys(changes).forEach(function(sku){
    var it = parsed.items.find(function(x){ return x.sku === sku; });
    if(!it) return;
    var c = changes[sku];
    var bits = [];
    ['price', 'akaji', 'takane'].forEach(function(f){
      if(c[f] != null && c[f] !== '') bits.push(FIELD_LABEL[f] + ' ' + yen(it[f]) + '→<span class="newv">' + yen(c[f]) + '</span>');
    });
    if(c.priceTrace != null && c.priceTrace !== ''){
      bits.push('自動変更 ' + (CORE.PRICETRACE_LABEL[it.priceTrace] || '') + '→<span class="newv">' + (CORE.PRICETRACE_LABEL[c.priceTrace] || c.priceTrace) + '</span>');
    }
    if(!bits.length) return;
    out.push('<div class="arow"><span class="an">' + esc(it.title.slice(0, 22)) + '</span><span class="av">' + bits.join(' / ') + '</span></div>');
  });
  return out.join('') || '<div class="arow"><span class="an">変更なし</span></div>';
}

function openSheet(){
  var n = Object.keys(changes).length;
  $('sheetDesc').textContent = '変更' + n + '件をプライスターに直接反映します（1〜2分）。';
  $('sheetDesc').hidden = false;
  $('applyStatus').hidden = true;
  $('applyStatus').innerHTML = '';
  $('applyList').hidden = false;
  $('applyList').innerHTML = changeSummaryHTML();
  $('doApply').hidden = false;
  $('doApply').disabled = n === 0;
  $('doApply').textContent = 'この内容で反映する';
  $('doExport').hidden = false;
  $('clearChanges').hidden = false;
  $('closeSheet').textContent = '閉じる';
  $('sheet').classList.remove('applying');
  $('sheetBack').classList.add('show');
  $('sheet').classList.add('show');
}

var APPLY_STEPS = [
  'プライスターにログイン中…',
  '最新の在庫を取り出し中…',
  '変更を書き込み中…',
  'プライスターで処理中…',
];
var applyTimer = null;

function showApplyProgress(n){
  var i = 0;
  $('applyStatus').hidden = false;
  var render = function(){
    $('applyStatus').innerHTML =
      '<div class="applybox">' +
        '<div class="spinner"></div>' +
        '<div class="applystep">' + APPLY_STEPS[i] + '</div>' +
        '<div class="applynote">' + n + '件を反映しています（あと' + Math.max(5, 75 - i * 18) + '秒ほど）<br>' +
        'この画面を閉じずにお待ちください</div>' +
      '</div>';
  };
  render();
  clearInterval(applyTimer);
  applyTimer = setInterval(function(){
    if(i < APPLY_STEPS.length - 1){ i++; render(); }
  }, 18000);
}

function showApplyResult(res, err){
  clearInterval(applyTimer);
  $('applyStatus').hidden = false;
  $('sheet').classList.remove('applying');
  if(err){
    // 失敗時は変更内容とボタンを残して、そのまま再試行できるようにする
    $('applyStatus').innerHTML =
      '<div class="applybox ng">' +
        '<div class="applybig">⚠️</div>' +
        '<div class="applyres ng">反映できませんでした</div>' +
        '<div class="applynote">' + esc(err) + '<br>変更内容はそのまま残っています。もう一度お試しください</div>' +
      '</div>';
    return;
  }
  $('sheetDesc').hidden = true;
  $('applyList').hidden = true;
  $('doApply').hidden = true;
  $('doExport').hidden = true;
  $('clearChanges').hidden = true;
  var changed = res.applied != null ? res.applied : 0;
  var errN = res.errorCount != null ? res.errorCount : 0;
  $('applyStatus').innerHTML =
    '<div class="applybox ok">' +
      '<div class="applybig">✅</div>' +
      '<div class="applyres ok">プライスターに反映しました</div>' +
      '<div class="applynote"><b>' + changed + '件</b>の変更を書き込みました' +
        (errN ? '<br>エラー ' + errN + '件（プライスターの画面で確認してください）' : '') +
        (res.missing && res.missing.length ? '<br>見つからなかった商品：' + res.missing.length + '件' : '') +
      '</div>' +
    '</div>';
  $('closeSheet').textContent = '閉じる';
}

$('doApply').addEventListener('click', function(){
  var n = Object.keys(changes).length;
  if(!n) return;
  var pass = localStorage.getItem('nesage-pass');
  if(!pass){ toast('先に「☁️ 更新」で合言葉を入れてください'); return; }
  if(!confirm('プライスターに ' + n + ' 件を反映します。よろしいですか？')) return;
  var sent = changes;
  var payload = JSON.stringify({ pass: pass, changes: sent });
  var btn = this;
  btn.disabled = true;
  btn.textContent = '反映中…';
  $('sheet').classList.add('applying');
  showApplyProgress(n);
  fetch(APPLY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: payload,
  })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res.error) throw new Error(res.error);
      // 反映した内容を手元のデータにも反映（クラウドは1日2回更新なので取り直さない）
      try{
        var out = CORE.buildExport(fileBytes, parsed, sent);
        fileBytes = out.bytes;
        parsed = CORE.parseFile(fileBytes);
        fileSource = '反映済み ' + new Date().toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
        idbPut('file', { bytes: fileBytes, name: fileName, at: importedAt, source: fileSource });
      }catch(e){}
      changes = {};
      saveChanges();
      refresh();
      showApplyResult(res, null);
    })
    .catch(function(e){
      showApplyResult(null, e.message || '通信に失敗しました');
      btn.disabled = false;
      btn.textContent = 'この内容で反映する';
    });
});
function closeSheet(){
  clearInterval(applyTimer);
  $('sheetBack').classList.remove('show');
  $('sheet').classList.remove('show');
  $('sheet').classList.remove('applying');
}
$('exportBtn').addEventListener('click', openSheet);
$('sheetBack').addEventListener('click', closeSheet);
$('closeSheet').addEventListener('click', closeSheet);

$('doExport').addEventListener('click', function(){
  try{
    var out = CORE.buildExport(fileBytes, parsed, changes);
    var d = new Date();
    var pad = function(n){ return String(n).padStart(2, '0'); };
    var name = 'editUploadProduct_FBA_nesage_' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.csv';
    var blob = new Blob([out.bytes], { type: 'text/csv' });
    var file = new File([blob], name, { type: 'text/csv' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file] }).then(function(){
        toast('書き出しました（変更' + out.changeCount + '件）');
      }).catch(function(){ /* キャンセルは何もしない */ });
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
      toast('ダウンロードしました（変更' + out.changeCount + '件）');
    }
  }catch(e){
    toast('書き出し失敗：' + e.message);
  }
});

$('clearChanges').addEventListener('click', function(){
  var n = Object.keys(changes).length;
  if(!n) { closeSheet(); return; }
  if(confirm('保留中の変更 ' + n + ' 件をすべて取り消しますか？')){
    changes = {};
    saveChanges();
    closeSheet();
    refresh();
    toast('変更を取り消しました');
  }
});

/* ---------- 起動 ---------- */
loadChanges();
idbGet('file').then(function(saved){
  if(saved && saved.bytes){
    try{
      fileBytes = saved.bytes instanceof Uint8Array ? saved.bytes : new Uint8Array(saved.bytes);
      fileName = saved.name; importedAt = saved.at; fileSource = saved.source || '';
      parsed = CORE.parseFile(fileBytes);
    }catch(e){ fileBytes = null; parsed = null; }
  }
  refresh();
}).catch(function(){ refresh(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
